<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Text Me">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<title>Text Me</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap">
<style>
  /* Layout: one screen. Controls top-right (right edge when sideways); message + number stacked from the top, sized to fill. */
  :root {
    --bg: #ffffff;
    --fg: #000000;
    --hint: #b5b5b5;
    --display: "Archivo Black", "Arial Black", Impact, system-ui, sans-serif;
    --ui: system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  :root.night { --bg: #000000; --fg: #ffffff; --hint: #555555; color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    transition: background .2s, color .2s;
  }
  main {
    height: 100%;
    display: flex; flex-direction: column; justify-content: flex-start; gap: var(--gap, 3vh);
    padding-block: calc(env(safe-area-inset-top, 0px) + 62px) max(16px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .box { flex: none; display: flex; justify-content: center; cursor: text; }
  .field {
    font-family: var(--display);
    line-height: 1.05; text-align: center;
    overflow-wrap: normal; word-break: normal;
    max-width: 100%; min-width: 1ch;
    outline: none;
    caret-color: currentColor;
  }
  #num { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .field:empty::before { content: attr(data-placeholder); color: var(--hint); }

  .controls {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 10px);
    right: calc(env(safe-area-inset-right, 0px) + 10px);
    display: flex; gap: 8px; z-index: 2;
  }
  .controls button {
    width: 42px; height: 42px; border-radius: 50%;
    border: 2px solid var(--fg); background: var(--bg); color: var(--fg);
    display: grid; place-items: center; cursor: pointer; padding: 0;
    font: 700 24px/1 var(--ui);
  }
  .controls button:disabled { opacity: .3; cursor: default; }
  .controls button:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
  .controls svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
  :root:not(.night) .sun, :root.night .moon { display: none; }

  /* Sideways: controls become a column on the right so the text can start at the very top */
  @media (orientation: landscape) {
    main {
      padding-block: calc(env(safe-area-inset-top, 0px) + 10px) max(10px, env(safe-area-inset-bottom, 0px));
      padding-right: calc(max(10px, env(safe-area-inset-right, 0px)) + 54px);
    }
    .controls { flex-direction: column; }
  }
</style>
<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</head>
<body>

<div class="controls">
  <button id="smaller" type="button" aria-label="Smaller text"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
  <button id="bigger" type="button" aria-label="Bigger text"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
  <button id="mode" type="button" aria-label="Switch to night mode">
    <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</div>

<main>
  <div class="box" data-for="msg"><div id="msg" class="field" contenteditable="true" spellcheck="false" enterkeyhint="next" role="textbox" aria-label="Your message" data-placeholder="Tap to write a message"></div></div>
  <div class="box" data-for="num"><div id="num" class="field" contenteditable="true" spellcheck="false" inputmode="tel" enterkeyhint="done" role="textbox" aria-label="Your phone number" data-placeholder="Tap for number"></div></div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const msg = $('msg'), num = $('num'), main = document.querySelector('main');
  const root = document.documentElement, modeBtn = $('mode');
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  // Text size steps: share of the largest size that fits the screen
  const STEPS = [0.35, 0.45, 0.55, 0.65, 0.75, 0.85, 1];
  let step = parseInt(store.get('tmm.step') ?? '', 10);
  if (!(step >= 0 && step < STEPS.length)) step = STEPS.length - 1;

  [msg, num].forEach(el => { try { el.contentEditable = 'plaintext-only'; } catch {} if (el.contentEditable !== 'plaintext-only') el.contentEditable = 'true'; });

  msg.textContent = store.get('tmm.msg') ?? '';
  num.textContent = store.get('tmm.num') ?? '';
  if (store.get('tmm.night') === '1') root.classList.add('night');
  const syncModeLabel = () => modeBtn.setAttribute('aria-label', root.classList.contains('night') ? 'Switch to day mode' : 'Switch to night mode');
  syncModeLabel();

  // Largest font size at which el fits inside W x H
  function maxFit(el, W, H) {
    let lo = 8, hi = Math.max(W, H);
    while (hi - lo > 1) {
      const mid = (lo + hi) >> 1;
      el.style.fontSize = mid + 'px';
      if (el.scrollWidth <= W && el.scrollHeight <= H) lo = mid; else hi = mid;
    }
    return lo;
  }
  function layout() {
    const cs = getComputedStyle(main);
    const W = main.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const gap = Math.round(main.clientHeight * 0.03);
    const H = main.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - gap;
    if (W <= 0 || H <= 0) return;
    main.style.setProperty('--gap', gap + 'px');
    const s = STEPS[step];
    // number gets up to 40% of the height; the message takes whatever is left
    const n = maxFit(num, W, H * 0.4);
    const numH = num.scrollHeight;
    const m = maxFit(msg, W, H - numH);
    msg.style.fontSize = Math.max(10, Math.floor(m * s)) + 'px';
    num.style.fontSize = Math.max(10, Math.floor(n * s)) + 'px';
    $('smaller').disabled = step === 0;
    $('bigger').disabled = step === STEPS.length - 1;
  }

  function clean(el) {
    if (el.querySelector('*') || /\n/.test(el.textContent)) {
      el.textContent = el.textContent.replace(/\s*\n\s*/g, ' ');
      const r = document.createRange(); r.selectNodeContents(el); r.collapse(false);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    }
    if (!el.textContent.trim() && el.textContent) el.textContent = '';
  }

  [msg, num].forEach(el => {
    el.addEventListener('input', () => { clean(el); store.set('tmm.' + el.id, el.textContent); layout(); });
    el.addEventListener('paste', e => {
      e.preventDefault();
      document.execCommand('insertText', false, (e.clipboardData?.getData('text/plain') || '').replace(/\s+/g, ' '));
    });
  });
  msg.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); num.focus(); } });
  num.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); num.blur(); } });

  document.querySelectorAll('.box').forEach(b => b.addEventListener('click', e => {
    const f = $(b.dataset.for);
    if (e.target !== f) { f.focus(); const r = document.createRange(); r.selectNodeContents(f); r.collapse(false); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  }));

  const setStep = d => { step = Math.min(STEPS.length - 1, Math.max(0, step + d)); store.set('tmm.step', step); layout(); };
  $('smaller').addEventListener('click', () => setStep(-1));
  $('bigger').addEventListener('click', () => setStep(1));

  modeBtn.addEventListener('click', () => {
    root.classList.toggle('night');
    store.set('tmm.night', root.classList.contains('night') ? '1' : '0');
    syncModeLabel();
  });

  const awake = async () => { try { await navigator.wakeLock?.request('screen'); } catch {} };
  document.addEventListener('pointerdown', awake, { once: true });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) awake(); });

  window.addEventListener('resize', () => requestAnimationFrame(layout));
  window.visualViewport?.addEventListener('resize', () => requestAnimationFrame(layout));
  layout();
  document.fonts?.ready.then(layout);
})();
</script>
</body>
</html>
