<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Text Me Maybe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap">
<style>
  /* Layout: one screen, two tap-to-type lines (message, number) that size themselves to fill it. */
  :root {
    --bg: #ffffff;
    --fg: #000000;
    --hint: #b5b5b5;
    --display: "Archivo Black", "Arial Black", Impact, system-ui, sans-serif;
    color-scheme: light;
  }
  :root.night { --bg: #000000; --fg: #ffffff; --hint: #555555; color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    transition: background .2s, color .2s;
  }
  main {
    height: 100%;
    display: flex; flex-direction: column; gap: 4vh;
    padding-block: max(56px, calc(env(safe-area-inset-top, 0px) + 12px)) max(20px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .box { flex: 1 1 0; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: text; }
  .box.msg { flex-grow: 1.3; }
  .field {
    font-family: var(--display);
    line-height: 1.05; text-align: center;
    overflow-wrap: normal; word-break: normal;
    max-width: 100%; min-width: 1ch;
    outline: none;
    caret-color: currentColor;
  }
  #num { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .field:empty::before { content: attr(data-placeholder); color: var(--hint); }

  #mode {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 10px);
    right: calc(env(safe-area-inset-right, 0px) + 10px);
    width: 44px; height: 44px; border-radius: 50%;
    border: 2px solid var(--fg); background: var(--bg); color: var(--fg);
    display: grid; place-items: center; cursor: pointer; padding: 0;
  }
  #mode:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
  #mode svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  :root:not(.night) .sun, :root.night .moon { display: none; }
</style>
</head>
<body>

<button id="mode" type="button" aria-label="Switch to night mode">
  <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
  <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>

<main>
  <div class="box msg" data-for="msg"><div id="msg" class="field" contenteditable="true" spellcheck="false" enterkeyhint="next" role="textbox" aria-label="Your message" data-placeholder="Tap to write a message"></div></div>
  <div class="box" data-for="num"><div id="num" class="field" contenteditable="true" spellcheck="false" inputmode="tel" enterkeyhint="done" role="textbox" aria-label="Your phone number" data-placeholder="Tap for number"></div></div>
</main>

<script>
(() => {
  const msg = document.getElementById('msg'), num = document.getElementById('num');
  const root = document.documentElement, modeBtn = document.getElementById('mode');
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  // Plain-text editing only
  [msg, num].forEach(el => { try { el.contentEditable = 'plaintext-only'; } catch {} if (el.contentEditable !== 'plaintext-only') el.contentEditable = 'true'; });

  msg.textContent = store.get('tmm.msg') ?? '';
  num.textContent = store.get('tmm.num') ?? '';
  if (store.get('tmm.night') === '1') root.classList.add('night');
  const syncModeLabel = () => modeBtn.setAttribute('aria-label', root.classList.contains('night') ? 'Switch to day mode' : 'Switch to night mode');
  syncModeLabel();

  // Grow text until it no longer fits its box
  function fit(el) {
    const box = el.parentElement, W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    let lo = 8, hi = Math.max(W, H);
    while (hi - lo > 1) {
      const mid = (lo + hi) >> 1;
      el.style.fontSize = mid + 'px';
      if (el.scrollWidth <= W && el.scrollHeight <= H) lo = mid; else hi = mid;
    }
    el.style.fontSize = lo + 'px';
  }
  const layout = () => { fit(msg); fit(num); };

  function clean(el) {
    // strip line breaks / stray markup a browser may insert
    if (el.querySelector('*') || /\n/.test(el.textContent)) {
      el.textContent = el.textContent.replace(/\s*\n\s*/g, ' ');
      const r = document.createRange(); r.selectNodeContents(el); r.collapse(false);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    }
    if (!el.textContent.trim() && el.textContent) el.textContent = '';
  }

  [msg, num].forEach(el => {
    el.addEventListener('input', () => { clean(el); store.set('tmm.' + el.id, el.textContent); layout(); });
    el.addEventListener('paste', e => {
      e.preventDefault();
      document.execCommand('insertText', false, (e.clipboardData?.getData('text/plain') || '').replace(/\s+/g, ' '));
    });
  });
  msg.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); num.focus(); } });
  num.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); num.blur(); } });

  // Tapping anywhere in a half focuses that line
  document.querySelectorAll('.box').forEach(b => b.addEventListener('click', e => {
    const f = document.getElementById(b.dataset.for);
    if (e.target !== f) { f.focus(); const r = document.createRange(); r.selectNodeContents(f); r.collapse(false); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  }));

  modeBtn.addEventListener('click', () => {
    root.classList.toggle('night');
    store.set('tmm.night', root.classList.contains('night') ? '1' : '0');
    syncModeLabel();
  });

  // Keep the screen awake while showing (if the phone allows it)
  const awake = async () => { try { await navigator.wakeLock?.request('screen'); } catch {} };
  document.addEventListener('pointerdown', awake, { once: true });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) awake(); });

  window.addEventListener('resize', () => requestAnimationFrame(layout));
  window.visualViewport?.addEventListener('resize', () => requestAnimationFrame(layout));
  layout();
  document.fonts?.ready.then(layout);
})();
</script>
</body>
</html>
