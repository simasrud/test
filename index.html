<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Text Me Maybe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600&display=swap">
<style>
  /* Layout: one landscape screen. Edit mode = two big inputs; Show mode = the sign, text auto-sized to fill. */
  :root {
    --bg: #111;
    --panel: #1c1c1c;
    --line: #333;
    --fg: #f5f5f5;
    --muted: #9a9a9a;
    --accent: #ff4f7b;
    --sign-bg: #000;
    --sign-fg: #fff;
    --sign-num: #ffd400;
    --display: "Archivo Black", "Arial Black", Impact, system-ui, sans-serif;
    --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--body);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- Edit mode ---------- */
  #edit {
    height: 100%;
    display: flex; flex-direction: column; justify-content: center; gap: 14px;
    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    max-width: 1100px; margin: 0 auto;
  }
  label { display: block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%;
    font: 400 clamp(20px, 4.5vh, 34px)/1.2 var(--body);
    color: var(--fg); background: var(--panel);
    border: 2px solid var(--line); border-radius: 10px;
    padding: 12px 14px;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  #phone { font-variant-numeric: tabular-nums; letter-spacing: .03em; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button {
    font: 600 16px var(--body);
    border-radius: 10px; border: 2px solid var(--line);
    background: var(--panel); color: var(--fg);
    padding: 12px 16px; cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #showBtn { background: var(--accent); border-color: var(--accent); color: #fff; flex: 1 1 200px; font-size: 20px; padding: 14px 18px; }
  .swatch { display: inline-flex; align-items: center; gap: 8px; }
  .swatch i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: inline-block; }
  .hint { color: var(--muted); font-size: 13px; margin: 0; }

  /* ---------- Show mode (the sign) ---------- */
  #sign {
    position: fixed; inset: 0;
    background: var(--sign-bg); color: var(--sign-fg);
    display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top, 0px) + 3vh) max(4vw, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 3vh) max(4vw, env(safe-area-inset-left, 0px));
    gap: 3vh;
    cursor: pointer;
    user-select: none;
  }
  #sign .box { flex: 1 1 0; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #sign .q { flex-grow: 1.15; }
  #sign .n { flex-grow: 1; }
  #qText, #nText {
    font-family: var(--display);
    line-height: 1.05; text-align: center;
    overflow-wrap: break-word;
    max-width: 100%;
  }
  #nText { color: var(--sign-num); white-space: nowrap; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  #exitHint {
    position: fixed; right: calc(env(safe-area-inset-right, 0px) + 10px); bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
    font: 12px var(--body); opacity: .35; color: var(--sign-fg);
  }

  /* Portrait nudge (only while showing the sign) */
  #rotate {
    position: fixed; inset: 0; background: var(--bg); color: var(--fg);
    display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px;
    text-align: center; padding: 24px; font-size: 18px;
  }
  #rotate .phone-ico { width: 46px; height: 76px; border: 4px solid var(--fg); border-radius: 10px; animation: turn 1.6s ease-in-out infinite; }
  @keyframes turn { 0%,30% { transform: rotate(0); } 60%,100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) { body.showing #rotate:not(.dismissed) { display: flex; } }
  @media (prefers-reduced-motion: reduce) { #rotate .phone-ico { animation: none; transform: rotate(-90deg); } }
</style>
</head>
<body>

<section id="edit" aria-label="Write your sign">
  <div>
    <label for="question">Your line</label>
    <input id="question" type="text" maxlength="120" autocomplete="off" enterkeyhint="next"
           value="Sorry, too shy to say hi. Coffee sometime?">
  </div>
  <div>
    <label for="phone">Your number</label>
    <input id="phone" type="tel" inputmode="tel" maxlength="24" autocomplete="tel" enterkeyhint="done"
           value="07700 900123">
  </div>
  <div class="row">
    <button id="showBtn" type="button">Show it</button>
    <button id="colourBtn" type="button" class="swatch" aria-label="Change sign colours"><i id="sw"></i><span id="swName">Night</span></button>
  </div>
  <p class="hint">Tap the sign to come back here. Hold your phone sideways for the biggest text.</p>
</section>

<section id="sign" hidden aria-live="polite">
  <div class="box q"><div id="qText"></div></div>
  <div class="box n"><div id="nText"></div></div>
  <span id="exitHint">tap to edit</span>
</section>

<div id="rotate" role="button" tabindex="0">
  <div class="phone-ico"></div>
  <div>Turn your phone sideways</div>
  <div style="font-size:13px;opacity:.6">(or tap to show it anyway)</div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const q = $('question'), p = $('phone');
  const edit = $('edit'), sign = $('sign'), rotate = $('rotate');
  const qText = $('qText'), nText = $('nText');

  const THEMES = [
    { name: 'Night',   bg: '#000000', fg: '#ffffff', num: '#ffd400' },
    { name: 'Day',     bg: '#ffffff', fg: '#000000', num: '#d6004f' },
    { name: 'Hi-vis',  bg: '#ffd400', fg: '#000000', num: '#000000' },
    { name: 'Blush',   bg: '#ff4f7b', fg: '#ffffff', num: '#ffffff' },
  ];
  let themeIdx = 0;

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  if (store.get('tmm.q') !== null) q.value = store.get('tmm.q');
  if (store.get('tmm.p') !== null) p.value = store.get('tmm.p');
  themeIdx = Math.min(THEMES.length - 1, Math.max(0, parseInt(store.get('tmm.t') || '0', 10) || 0));

  function applyTheme() {
    const t = THEMES[themeIdx];
    const r = document.documentElement.style;
    r.setProperty('--sign-bg', t.bg); r.setProperty('--sign-fg', t.fg); r.setProperty('--sign-num', t.num);
    $('sw').style.background = t.bg; $('sw').style.boxShadow = `inset 0 0 0 5px ${t.num}`;
    $('swName').textContent = t.name;
  }
  applyTheme();

  q.addEventListener('input', () => store.set('tmm.q', q.value));
  p.addEventListener('input', () => store.set('tmm.p', p.value));
  q.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); p.focus(); } });
  p.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); show(); } });
  $('colourBtn').addEventListener('click', () => { themeIdx = (themeIdx + 1) % THEMES.length; store.set('tmm.t', themeIdx); applyTheme(); });

  // Grow text until it no longer fits its box (binary search on font-size).
  function fit(el, box) {
    const W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    let lo = 8, hi = Math.max(W, H);
    while (hi - lo > 1) {
      const mid = (lo + hi) >> 1;
      el.style.fontSize = mid + 'px';
      if (el.scrollWidth <= W && el.scrollHeight <= H) lo = mid; else hi = mid;
    }
    el.style.fontSize = lo + 'px';
  }
  function layout() {
    if (sign.hidden) return;
    fit(qText, qText.parentElement);
    fit(nText, nText.parentElement);
  }

  let wakeLock = null;
  async function keepAwake() {
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch {}
  }

  function show() {
    q.blur(); p.blur();
    qText.textContent = q.value.trim() || 'Hi :)';
    nText.textContent = p.value.trim() || '—';
    edit.hidden = true; sign.hidden = false;
    document.body.classList.add('showing');
    rotate.classList.remove('dismissed');
    keepAwake();
    try { document.documentElement.requestFullscreen?.().catch(() => {}); } catch {}
    try { screen.orientation?.lock?.('landscape').catch(() => {}); } catch {}
    requestAnimationFrame(layout);
    if (document.fonts?.ready) document.fonts.ready.then(layout);
  }
  function hide() {
    sign.hidden = true; edit.hidden = false;
    document.body.classList.remove('showing');
    try { wakeLock?.release(); } catch {} wakeLock = null;
    try { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); } catch {}
  }

  $('showBtn').addEventListener('click', show);
  sign.addEventListener('click', hide);
  rotate.addEventListener('click', () => { rotate.classList.add('dismissed'); requestAnimationFrame(layout); });
  rotate.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') rotate.click(); });
  window.addEventListener('resize', () => requestAnimationFrame(layout));
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !sign.hidden) keepAwake(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !sign.hidden) hide(); });
})();
</script>
</body>
</html>
